[project]
name = "cf_rules"
description = "Wrapper library to import / export multiple remote rules and easily create, modify and delete rules."
requires-python = ">=3.12"
readme = "README.md"
keywords = [
  "api",
  "rules",
  "wrapper",
  "library",
  "firewall",
  "waf",
  "cloudflare",
  "bulk",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Quentin Lienhardt", email = "pro@quentium.fr" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.34.2"]

dynamic = ["version"]

[dependency-groups]
docs = [
  "sphinx>=9.1.0",
  "sphinx-rtd-theme>=3.1.0",
  "sphinx-copybutton>=0.5.2",
  "sphinx-autobuild>=2025.8.25",
]

[project.urls]
"Homepage" = "https://github.com/QuentiumYT/Cloudflare-Firewall-Rules"
"Documentation" = "https://quentiumyt.github.io/Cloudflare-Firewall-Rules/"
"Source Code" = "https://github.com/QuentiumYT/Cloudflare-Firewall-Rules"
"Bug Reports" = "https://github.com/QuentiumYT/Cloudflare-Firewall-Rules/issues"

[tool.setuptools.dynamic]
version = { attr = "cf_rules.__version__" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  # flake8-bugbear
  "B",
  # flake8-comprehensions
  "C4",
  # pycodestyle errors
  "E",
  # pyflakes
  "F",
  # flake8-logging-format
  "G",
  # isort
  "I",
  # flake8-implicit-str-concat
  "ISC",
  # pylint convention
  "PLC",
  # pylint errors
  "PLE",
  # flake8-simplify
  "SIM",
  # pyupgrade
  "UP",
  # pycodestyle warnings
  "W",
]
